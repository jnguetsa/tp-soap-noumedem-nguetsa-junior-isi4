<div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-5">
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center font-bold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      </div>
      <div>
        <h2 class="text-base font-semibold text-slate-900">Passerelle SOAP</h2>
        <p class="text-xs text-slate-500">Classification du compte via Web Service</p>
      </div>
    </div>
    <span class="text-[11px] font-mono font-medium px-2 py-0.5 rounded bg-slate-100 text-slate-600 border border-slate-200">WSDL / XML</span>
  </div>

  <div class="flex gap-2">
    <div class="relative flex-1">
      <input type="number" [(ngModel)]="compteId" placeholder="ID du compte (ex: 1)..."
             class="w-full px-3.5 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-4 focus:ring-amber-500/10 focus:border-amber-600 focus:outline-none transition-all placeholder:text-slate-400">
    </div>
    <button (click)="consulterCategorie()"
            class="bg-amber-600 hover:bg-amber-700 active:scale-[0.98] text-white text-xs font-medium px-4 py-2 rounded-xl transition-colors shadow-sm shadow-amber-200 flex items-center gap-1.5 whitespace-nowrap">
      <span>Consulter</span>
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
    </button>
  </div>

  @if (resultat){
    <div class="p-4 rounded-xl bg-amber-50/40 border border-amber-200/80 space-y-3">
      <div class="flex justify-between items-center border-b border-amber-100/80 pb-2.5">
        <span class="text-xs font-medium text-slate-500">Numéro de Compte</span>
        <span class="text-sm font-mono font-semibold text-slate-800">{{ resultat.numeroCompte }}</span>
      </div>

      <div class="flex justify-between items-center border-b border-amber-100/80 pb-2.5">
        <span class="text-xs font-medium text-slate-500">Catégorie Attribuée</span>
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-800 border border-amber-200">
          {{ resultat.categorie }}
        </span>
      </div>

      <div class="pt-0.5">
        <span class="text-xs font-medium text-slate-500 block mb-1">Message du Service :</span>
        <p class="text-xs text-slate-700 bg-white/70 p-2.5 rounded-lg border border-amber-100 leading-relaxed font-mono">
          {{ resultat.message }}
        </p>
      </div>
    </div>
  } @else {
    <div class="py-6 rounded-xl border border-dashed border-slate-200 text-center text-xs text-slate-400">
      En attente d'une requête SOAP...
    </div>
  }
</div>
